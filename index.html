<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monster Shooter</title>
<style>body{margin:0;background:#090d20;color:white;font-family:system-ui;text-align:center}h1{color:#7ef4ff}canvas{width:min(96vw,900px);height:auto;background:#111a34;border:2px solid #4b638d;border-radius:15px;touch-action:none}button{padding:14px 32px;background:#7ef4ff;border:0;border-radius:12px;font-weight:bold;font-size:18px}p{color:#b8c9e7}.sound{position:fixed;right:12px;top:12px;z-index:5;padding:9px 13px;font-size:14px;background:#233257;color:#fff;border:1px solid #7ef4ff}.stage{position:relative;width:min(96vw,900px);margin:auto}.stage canvas{width:100%;display:block;box-sizing:border-box}.start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;white-space:nowrap;box-shadow:0 0 0 999px #060b19aa,0 0 24px #7ef4ff55}.start[hidden]{display:none}@media(max-width:600px){h1{font-size:clamp(20px,6vw,30px);margin:12px 0}h2{font-size:clamp(14px,4vw,19px)}body{padding:0 4px}}</style>
<button id="sound" class="sound" aria-pressed="true">♫ Звук: вкл</button><h1>👾 MONSTER SHOOTER</h1><h2>Очки: <span id="score">0</span> | Жизни: <span id="life">3</span> | Рекорд: <span id="best">0</span></h2>
<div class="stage"><canvas id="game" width="900" height="500"></canvas><button class="start" id="start">▶ Играть</button></div><p id="status" role="status">Стреляй по монстрам, пока они не убежали!</p>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),start=document.getElementById('start');
const soundButton=document.getElementById('sound');
let soundEnabled=true,audioCtx=null,musicTimer=null,musicStep=0;
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
const notes=[0,3,7,10,7,3,2,5,0,3,8,7,5,3,-2,2];
const bass=[0,-5,-7,-5];
function tone(midi,at,duration,volume,type='square'){
 if(!audioCtx||!soundEnabled)return;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type=type;osc.frequency.setValueAtTime(440*Math.pow(2,(midi-69)/12),at);
 gain.gain.setValueAtTime(0.0001,at);gain.gain.exponentialRampToValueAtTime(volume,at+.012);
 gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);osc.start(at);osc.stop(at+duration+.02);
}
function musicBeat(){
 if(!running||!soundEnabled||!audioCtx)return;
 const at=audioCtx.currentTime+.02,n=musicStep;
 tone(64+notes[n%16],at,.18,.045,'square');
 if(n%2===0)tone(40+bass[Math.floor(n/4)%4],at,.31,.065,'triangle');
 if(n%4===2)tone(76,at,.035,.015,'square');
 musicStep++;
}
function stopMusic(){if(musicTimer!==null){clearInterval(musicTimer);musicTimer=null}}
function startMusic(){
 stopMusic();
 if(!soundEnabled||!AudioContextClass)return;
 try{
  if(!audioCtx)audioCtx=new AudioContextClass();
  audioCtx.resume().catch(()=>{});
  musicStep=0;musicBeat();musicTimer=setInterval(musicBeat,250);
 }catch(e){console.warn('Audio unavailable:',e)}
}
soundButton.onclick=()=>{
 soundEnabled=!soundEnabled;
 soundButton.textContent=soundEnabled?'♫ Звук: вкл':'♫ Звук: выкл';
 soundButton.setAttribute('aria-pressed',String(soundEnabled));
 if(soundEnabled&&running)startMusic();else stopMusic();
};
let monsters=[],score=0,lives=3,running=false,last=0,spawn=0,elapsed=0,best=Number(localStorage.getItem('monsterBest')||0);bestEl.textContent=best;
function add(){monsters.push({x:40+Math.random()*820,y:540,r:22+Math.random()*14,v:75+Math.min(elapsed*2,110),color:['#f75ba9','#6cf6ff','#baff65','#b995ff'][Math.floor(Math.random()*4)]})}
function draw(){x.clearRect(0,0,900,500);x.strokeStyle='#233257';for(let i=0;i<900;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,500);x.stroke()}for(const m of monsters){x.fillStyle=m.color;x.shadowColor=m.color;x.shadowBlur=18;x.beginPath();x.arc(m.x,m.y,m.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#0b1020';x.beginPath();x.arc(m.x-m.r*.3,m.y-5,4,0,7);x.arc(m.x+m.r*.3,m.y-5,4,0,7);x.fill();x.beginPath();x.arc(m.x,m.y+6,7,0,Math.PI);x.strokeStyle='#0b1020';x.lineWidth=3;x.stroke()}}
function tick(t){if(!running)return;let dt=Math.min((t-last)/1000,.05);last=t;elapsed+=dt;spawn+=dt;if(spawn>Math.max(.42,1.2-elapsed*.01)){spawn=0;add()}for(const m of monsters)m.y-=m.v*dt;let missed=monsters.filter(m=>m.y+m.r<0).length;if(missed){lives=Math.max(0,lives-missed);lifeEl.textContent=lives;monsters=monsters.filter(m=>m.y+m.r>=0)}draw();if(!lives){running=false;stopMusic();statusEl.textContent='Игра окончена! Очки: '+score;start.hidden=false;start.textContent='Играть снова';return}requestAnimationFrame(tick)}
c.addEventListener('pointerdown',e=>{if(!running)return;let r=c.getBoundingClientRect(),px=(e.clientX-r.left)*900/r.width,py=(e.clientY-r.top)*500/r.height;for(let i=monsters.length-1;i>=0;i--){let m=monsters[i];if(Math.hypot(m.x-px,m.y-py)<m.r+10){monsters.splice(i,1);score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('monsterBest',best)}draw();break}}});
start.onclick=()=>{score=0;lives=3;elapsed=0;spawn=0;monsters=[];scoreEl.textContent=0;lifeEl.textContent=3;statusEl.textContent='Лови монстров!';start.hidden=true;running=true;startMusic();last=performance.now();requestAnimationFrame(tick)};draw();
</script>
